<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Office</title>
</head>
<body>
<h1>OFFICE</h1>
    <div id="office">

        <label for="name">Name:
            <input type="text" id="name" name="employeeName" placeholder="Enter your name">
        </label>

        <br><br>

        <label for="name">location:
            <input type="text" id="location" name="employeeLocation" placeholder="please enter your location">
        </label>

        <br><br>

        <label for="name">Department:
            <select id="department"> <option id="departments"> </option> </select>
        </label>

        <br><br>

        <label for="name">Designation:
            <select id="designation"> <option id="designations"></option> </select>
        </label>

        <br><br>

        <label for="name">Project:
            <select id="project"> <option id="projects"></option> </select>
        </label>

        <br><br>

        <label for="name">Joining Date:
            <select id="joiningDate">
                <option id="joiningDates">Select One</option>
            </select>
        </label>

    </div>

<button id="getData">load</button>
<button id="save">save</button>

</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/office.js"></script>

</html>
